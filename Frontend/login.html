<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="signup-container auth-card">

    <div class="left-panel classy-panel">
        <div class="auth-badge">WELCOME BACK</div>

        <h1>Continue your travel story.</h1>

        <p>
            Open your saved trips, refine your itinerary,
            and keep your travel plans beautifully organized.
        </p>

        <div class="auth-mini-card">
            <span>Your Planner</span>
            <strong>Trips • Budget • Itinerary</strong>
        </div>
    </div>

    <div class="right-panel">
        <div class="form-box">

            <h2>Login</h2>
            <p class="form-subtitle">Access your personal travel workspace.</p>

            <input type="email" id="loginEmail" placeholder="Email Address">
            <input type="password" id="loginPassword" placeholder="Password">

            <button onclick="loginUser()">Login</button>

            <p id="loginMessage"></p>

            <p class="switch-link">
                Don’t have an account?
                <a href="signup.html">Create one</a>
            </p>

        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
